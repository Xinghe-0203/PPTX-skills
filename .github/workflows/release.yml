name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Verify tag matches package version
        shell: bash
        run: |
          PACKAGE_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "$GITHUB_REF_NAME" = "v$PACKAGE_VERSION"
      - name: Install validation dependencies
        run: python -m pip install -e ".[adaptive,qa-image,test]" ruff mypy
      - name: Validate source
        run: |
          python -m ruff check pptx_skill/ scripts/ tests/
          python -m mypy pptx_skill/
          python -m pytest tests/ -q

  build:
    name: Build release artifacts
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build dependencies
        run: python -m pip install ".[build]"
      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*
      - name: Smoke test release wheel
        run: |
          python -m venv "$RUNNER_TEMP/pptx-release-smoke"
          "$RUNNER_TEMP/pptx-release-smoke/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/pptx-release-smoke/bin/python" -I -c "from pptx_skill import __version__, list_templates; assert __version__ == '${GITHUB_REF_NAME#v}'; assert len(list_templates()) >= 20"
      - uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
