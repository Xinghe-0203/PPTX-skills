[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pptx-skill"
version = "5.0.0"
description = "The world's most powerful PPTX generation, editing, and manipulation toolkit — morph, zoom, OCR, SVG, batch, chart editing, color science, and more"
readme = "SKILL.md"
requires-python = ">=3.12"
authors = [
    {name = "Xinghe"},
]
dependencies = [
    "python-pptx>=1.0,<2",
    "Pillow>=12,<13",
]

[project.optional-dependencies]
adaptive = ["kiwisolver>=1.4,<2"]
schema = ["pydantic>=2,<3"]
qa-image = ["numpy>=2,<3", "scikit-image>=0.25,<1"]
qa-cv = ["opencv-python-headless>=4.10,<5"]
qa-geometry = ["shapely>=2,<3"]
qa-ocr = ["pytesseract>=0.3,<1"]
text-complex = ["fonttools>=4,<5", "uharfbuzz>=0.50,<1"]
render-pdf = ["PyMuPDF>=1.28,<2"]
render-pdf-poppler = ["pdf2image>=1.17,<2"]
render-com = ["pywin32>=306,<400; platform_system == 'Windows'"]
chart-editable = ["openpyxl>=3,<4"]
vba-parse = ["olefile>=0.47,<1"]
html-import = ["beautifulsoup4>=4,<5"]
encrypt = ["msoffcrypto-tool>=4,<6"]
ocr-easy = ["easyocr>=1,<2"]
ocr-paddle = ["paddleocr>=2,<3", "paddlepaddle>=2,<3"]
test = ["pytest>=8,<10", "hypothesis>=6,<7"]

[project.scripts]
pptx-skill-capability = "pptx_skill.capability:main"

[project.urls]
Homepage = "https://github.com/Xinghe-0203/pptx-skill"
Issues = "https://github.com/Xinghe-0203/pptx-skill/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["pptx_skill*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
"tests/*" = ["E402"]
"pptx_skill/__init__.py" = ["E402", "F401"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
